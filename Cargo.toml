[package]
name = "fluxo"
version = "0.1.0"
edition = "2024"

[dependencies]
directories = "6.0.0"
eframe = "0.37.0"
egui = "0.37"
egui_extras = { version = "0.37.0", features = ["all_loaders", "http"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
lzma-rs = "0.3.0"
open = "5.4.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tar = "0.4.46"
ureq = "3.5.0"
zip = { version = "9.1.1", default-features = false, features = ["deflate"] }
